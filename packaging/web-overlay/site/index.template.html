<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#b7410e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Split Happens" />
    <meta name="description" content="Split Happens — an open-source PDF workbench. Combine, split, edit and sign PDFs, right on your phone. Works offline." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <title>Split Happens — Merge & Split PDFs</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f1f1f3; }
      canvas#printcraft { width: 100%; height: 100%; display: block; outline: none; }
      @media (prefers-color-scheme: dark) { html, body { background: #19191c; } }

      /* Loading overlay — shown while the ~37MB app downloads and starts */
      #loader {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; padding: 32px; text-align: center;
        background: #f1f1f3; color: #1c1c1e;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: opacity .4s ease;
      }
      @media (prefers-color-scheme: dark) {
        #loader { background: #19191c; color: #f2f2f4; }
      }
      #loader.done { opacity: 0; pointer-events: none; }
      #loader .logo {
        width: 76px; height: 76px; border-radius: 18px;
        background: linear-gradient(135deg, #b7410e, #e07b39);
        display: flex; align-items: center; justify-content: center;
        font-size: 40px; font-weight: 700; color: #fff;
        box-shadow: 0 8px 24px rgba(183,65,14,.35);
      }
      #loader h1 { margin: 0; font-size: 22px; font-weight: 700; }
      #loader p { margin: 0; font-size: 14px; opacity: .65; max-width: 300px; line-height: 1.5; }
      #loader .bar {
        width: min(280px, 70vw); height: 8px; border-radius: 99px;
        background: rgba(127,127,127,.25); overflow: hidden;
      }
      #loader .bar > div {
        height: 100%; width: 0%; border-radius: 99px;
        background: linear-gradient(90deg, #b7410e, #e07b39);
        transition: width .2s ease;
      }
      #loader .pct { font-size: 13px; font-variant-numeric: tabular-nums; opacity: .65; min-height: 18px; }
      #loader .retry {
        display: none; margin-top: 4px; padding: 12px 28px; border: 0; border-radius: 99px;
        background: #b7410e; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
      }
      #loader .mobile-link { margin-top: 10px; font-size: 14px; }
      #loader .mobile-link a { color: #b7410e; font-weight: 600; }
      #loader.error .bar, #loader.error .pct { display: none; }
      #loader.error .retry { display: block; }
    </style>
  <link rel="modulepreload" href="./%%JS%%" crossorigin="anonymous" integrity="%%JS_INT%%"><link rel="preload" href="./%%WASM%%" crossorigin="anonymous" integrity="%%WASM_INT%%" as="fetch" type="application/wasm"></head>
  <body>
    <div id="loader" role="status" aria-live="polite">
      <div class="logo">P</div>
      <h1>Split Happens</h1>
      <p id="loadmsg">Downloading the app (37&nbsp;MB, one time)…</p>
      <div class="bar"><div id="loadbar"></div></div>
      <div class="pct" id="loadpct">0%</div>
      <button class="retry" id="loadretry">Try again</button>
      <div class="mobile-link">On a phone? <a href="./mobile/">Try the touch-friendly mobile version →</a></div>
      <div class="mobile-link"><a href="./privacy.html">Privacy &amp; Security</a> — your files never leave your device.</div>
    </div>
    <canvas id="printcraft"></canvas>

<script type="module">
const loader = document.getElementById('loader');
const bar = document.getElementById('loadbar');
const pct = document.getElementById('loadpct');
const msg = document.getElementById('loadmsg');
const retry = document.getElementById('loadretry');

function setProgress(frac, text) {
  const p = Math.max(0, Math.min(1, frac));
  bar.style.width = (p * 100).toFixed(0) + '%';
  pct.textContent = (p * 100).toFixed(0) + '%';
  if (text) msg.innerHTML = text;
}
function fail(text) {
  loader.classList.add('error');
  msg.innerHTML = text;
}
retry.addEventListener('click', () => location.reload());

// Offline support: cache the app shell after first load.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

const WASM_URL = './%%WASM%%';

async function fetchWithProgress(url) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error('Download failed (HTTP ' + resp.status + ')');
  const total = parseInt(resp.headers.get('content-length') || '0', 10);
  if (!resp.body || !total) return new Uint8Array(await resp.arrayBuffer());
  const reader = resp.body.getReader();
  const chunks = [];
  let received = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    setProgress(received / total);
  }
  const bytes = new Uint8Array(received);
  let offset = 0;
  for (const c of chunks) { bytes.set(c, offset); offset += c.length; }
  return bytes;
}

try {
  const { default: init, ...bindings } = await import('./%%JS%%');
  setProgress(0.02, 'Downloading the app (37&nbsp;MB, one time)…');
  const bytes = await fetchWithProgress(WASM_URL);
  setProgress(1, 'Downloaded. Starting Split Happens…');
  // Let the UI paint before the heavy compile step.
  await new Promise(r => setTimeout(r, 60));
  const wasm = await init({ module_or_path: bytes });
  window.wasmBindings = bindings;
  dispatchEvent(new CustomEvent('TrunkApplicationStarted', { detail: { wasm } }));
  // Hide the loader once the app has painted its first frame.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    setTimeout(() => loader.classList.add('done'), 400);
  }));
} catch (e) {
  console.error(e);
  fail('Couldn&rsquo;t start Split Happens. Check your connection and <b>use Wi-Fi</b> for the first load (37&nbsp;MB), then try again.');
}
</script>
  </body>
</html>
